<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC CityGen</title>
  <link rel="icon" href="/app-icon.svg">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="viewer/viewer.css">
  <link rel="stylesheet" href="form/form.css">
  <link rel="stylesheet" href="progress/progress.css">
</head>
<body>
  <!-- The sky: the brand, and the three steps of the pipeline as tabs. -->
  <header class="sky">
    <div class="clouds" aria-hidden="true"><i class="cloud cloud-a"></i><i class="cloud cloud-b"></i><i class="cloud cloud-c"></i><i class="cloud cloud-d"></i><i class="cloud cloud-e"></i><i class="cloud cloud-f"></i><i class="cloud cloud-g"></i><i class="cloud cloud-h"></i></div>
    <div class="brand"><img src="/app-icon.svg" alt="" width="30" height="30"><span>MC CityGen</span></div>
    <nav class="steps" role="tablist" data-text-label="page.stepsLabel">
      <button class="step" role="tab" data-tab="extract" aria-selected="true" data-text-title="page.steps.extract.tip">
        <span class="step-num">1</span><span class="step-text"><b data-text="page.steps.extract.name"></b><small data-text="page.steps.extract.sub"></small></span>
      </button>
      <button class="step" role="tab" data-tab="preview" data-text-title="page.steps.preview.tip">
        <span class="step-num">2</span><span class="step-text"><b data-text="page.steps.preview.name"></b><small data-text="page.steps.preview.sub"></small></span>
      </button>
      <button class="step" role="tab" data-tab="build" data-text-title="page.steps.build.tip">
        <span class="step-num">3</span><span class="step-text"><b data-text="page.steps.build.name"></b><small data-text="page.steps.build.sub"></small></span>
      </button>
    </nav>
    <div class="language" data-text-title="page.language"><i class="icon icon-language"></i><select id="language" data-text-label="page.language"></select></div>
  </header>

  <!-- Extract: Stages 1 and 2 -->
  <main class="page" id="extract" role="tabpanel">
    <section class="stage">
      <div class="viewer" id="viewer-roads" data-caption="page.viewers.roads.caption" data-icon="extract" data-bounded="width"
           data-message="page.viewers.roads.message"></div>
      <div class="viewer" id="viewer-builds" data-caption="page.viewers.builds.caption" data-icon="extract" data-bounded="width"
           data-message="page.viewers.builds.message"></div>
    </section>

    <section class="dock">
      <div class="dock-row">
        <div class="field">
          <label for="world-path" data-text="page.world.label"></label>
          <div class="input-group">
            <input type="text" id="world-path" class="world-path" data-text-placeholder="page.world.placeholder" spellcheck="false">
            <button type="button" class="btn secondary" id="browse-button"><i class="icon icon-folder"></i><span data-text="page.world.browse"></span></button>
          </div>
        </div>
        <div class="field">
          <label for="source-version" data-text="page.world.source"></label>
          <input type="text" id="source-version" class="source-version" readonly placeholder="-"
                 data-text-title="page.world.sourceTip">
        </div>
        <div class="field">
          <label for="target-version" data-text="page.world.target"></label>
          <select id="target-version" data-text-title="page.world.targetTip"></select>
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" id="reset-world-button"
                data-text-title="page.world.resetTip"><i class="icon icon-reset"></i><span data-text="page.world.reset"></span></button>
        <button type="button" class="btn primary big" id="extract-button" disabled><i class="icon icon-extract"></i><span data-text="page.world.run"></span></button>
      </div>
      <div class="areas">
        <div class="area-card" data-area="road" data-text-title="page.areas.road.tip">
          <div class="area-top"><h3 data-text="page.areas.road.name"></h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i><span data-text="page.areas.choose"></span></button>
        </div>
        <div class="area-card" data-area="house" data-text-title="page.areas.house.tip">
          <div class="area-top"><h3 data-text="page.areas.house.name"></h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i><span data-text="page.areas.choose"></span></button>
        </div>
        <div class="area-card" data-area="landmark" data-text-title="page.areas.landmark.tip">
          <div class="area-top"><h3 data-text="page.areas.landmark.name"></h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i><span data-text="page.areas.choose"></span></button>
        </div>
      </div>
    </section>
  </main>

  <!-- Preview: Stage 3 -->
  <main class="page" id="preview" role="tabpanel" hidden>
    <section class="stage">
      <div class="viewer" id="viewer-grid" data-caption="page.viewers.grid.caption" data-icon="refresh" data-bounded="height"
           data-message="page.viewers.grid.message"></div>
      <div class="viewer" id="viewer-city-preview" data-caption="page.viewers.cityPreview.caption" data-icon="refresh" data-bounded="height"
           data-message="page.viewers.cityPreview.message"></div>
    </section>

    <section class="dock algo-controls">
      <div class="dock-row">
        <span class="selectors"></span>
        <button type="button" class="disclosure" aria-expanded="false"><span></span><i class="chevron"></i></button>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" data-action="reset"><i class="icon icon-reset"></i><span data-text="page.preview.reset"></span></button>
        <button type="button" class="btn primary big" data-action="run" disabled><i class="icon icon-refresh"></i><span data-text="page.preview.run"></span></button>
      </div>
      <div class="advanced"><div class="advanced-inner"></div></div>
    </section>
  </main>

  <!-- Build: Stages 4 and 5 -->
  <main class="page" id="build" role="tabpanel" hidden>
    <section class="stage">
      <div class="viewer" id="viewer-city-render" data-caption="page.viewers.cityRender.caption" data-icon="render" data-bounded="height"
           data-message="page.viewers.cityRender.message"></div>
    </section>

    <section class="dock algo-controls">
      <div class="dock-row">
        <span class="selectors"></span>
        <button type="button" class="disclosure" aria-expanded="false"><span></span><i class="chevron"></i></button>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" data-action="worlds"
                data-text-title="page.build.worldsTip"><i class="icon icon-folder"></i><span data-text="page.build.worlds"></span></button>
        <button type="button" class="btn primary big" data-action="run" disabled><i class="icon icon-render"></i><span data-text="page.build.run"></span></button>
      </div>
      <div class="advanced"><div class="advanced-inner"></div></div>
    </section>
  </main>

  <!-- The ground the window stands on, and the run of the tab that's showing, step by step: grass growing over dirt. -->
  <footer class="ground">
    <div class="ground-run current" data-tab="extract"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
    <div class="ground-run" data-tab="preview"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
    <div class="ground-run" data-tab="build"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
  </footer>

  <!-- The region map: the world from above, to snap an area to chunks -->
  <dialog id="region-dialog" class="region-dialog">
    <header class="dialog-head">
      <h2></h2>
      <p class="hints"><kbd>Shift</kbd> + <span data-text="page.map.select"></span><span class="dot">·</span><span data-text="page.map.pan"></span><span class="dot">·</span><span data-text="page.map.zoom"></span></p>
    </header>
    <div class="map-frame">
      <div class="viewer" id="viewer-region" data-icon="map" data-message="mapLoading"></div>
    </div>
    <footer class="dialog-foot">
      <div class="foot-info">
        <p class="status"></p>
        <div class="runbar map-run"><span class="status" data-text="mapDrawing"></span><span class="spinner"></span>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="progress-chunk"></div></div>
        </div>
      </div>
      <button type="button" class="btn secondary" data-action="cancel" autofocus data-text="page.map.cancel"></button>
      <button type="button" class="btn primary" data-action="apply" disabled data-text="page.map.apply"></button>
    </footer>
  </dialog>

  <dialog id="error-dialog" class="error-dialog">
    <div class="error-mark" aria-hidden="true">!</div>
    <div>
      <h2></h2>
      <p></p>
      <form method="dialog" class="dialog-foot"><button class="btn primary" data-text="page.ok"></button></form>
    </div>
  </dialog>

  <script src="text.js"></script>
  <script src="dom.js"></script>
  <script src="viewer/viewer.js"></script>
  <script src="progress/progress.js"></script>
  <script src="progress/steps.js"></script>
  <script src="form/form.js"></script>
  <script src="region/reveal.js"></script>
  <script src="region/region.js"></script>
  <script src="app.js"></script>
</body>
</html>
