<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC CityGen</title>
  <link rel="icon" href="/app-icon.svg">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="viewer/viewer.css">
  <link rel="stylesheet" href="form/form.css">
  <link rel="stylesheet" href="progress/progress.css">
</head>
<body>
  <!-- The sky: the brand, and the three steps of the pipeline as tabs. -->
  <header class="sky">
    <div class="clouds" aria-hidden="true"><i class="cloud cloud-a"></i><i class="cloud cloud-b"></i><i class="cloud cloud-c"></i><i class="cloud cloud-d"></i><i class="cloud cloud-e"></i><i class="cloud cloud-f"></i><i class="cloud cloud-g"></i><i class="cloud cloud-h"></i></div>
    <div class="brand"><img src="/app-icon.svg" alt="" width="30" height="30"><span>MC CityGen</span></div>
    <nav class="steps" role="tablist" aria-label="Steps">
      <button class="step" role="tab" data-tab="extract" aria-selected="true"
              title="Step 1 of 3: Choose an MC world and extract road, house, and landmark assets.">
        <span class="step-num">1</span><span class="step-text"><b>Extract</b><small>Pieces from your world</small></span>
      </button>
      <button class="step" role="tab" data-tab="preview"
              title="Step 2 of 3: Test seeds and Avenue/Street settings before the final build.">
        <span class="step-num">2</span><span class="step-text"><b>Preview</b><small>Try city layouts</small></span>
      </button>
      <button class="step" role="tab" data-tab="build"
              title="Step 3 of 3: Build the city, render it, and export the MC world.">
        <span class="step-num">3</span><span class="step-text"><b>Build</b><small>The city and its world</small></span>
      </button>
    </nav>
  </header>

  <!-- Extract: Stages 1 and 2 -->
  <main class="page" id="extract" role="tabpanel">
    <section class="stage">
      <div class="viewer" id="viewer-roads" data-caption="Road pieces" data-icon="extract" data-bounded="width"
           data-message="Extract assets to scan the selected road sample area and build a road contact sheet."></div>
      <div class="viewer" id="viewer-builds" data-caption="Building pieces" data-icon="extract" data-bounded="width"
           data-message="Extract assets to scan the selected house and landmark areas and build a building contact sheet."></div>
    </section>

    <section class="dock">
      <div class="dock-row">
        <div class="field">
          <label for="world-path">MC world</label>
          <div class="input-group">
            <input type="text" id="world-path" class="world-path" placeholder="Select an MC world folder" spellcheck="false">
            <button type="button" class="btn secondary" id="browse-button"><i class="icon icon-folder"></i>Browse</button>
          </div>
        </div>
        <div class="field">
          <label for="source-version">Source version</label>
          <input type="text" id="source-version" class="source-version" readonly placeholder="-"
                 title="The MC version of the world you selected.">
        </div>
        <div class="field">
          <label for="target-version">Target version</label>
          <select id="target-version"
                  title="Lets you confirm which MC version you plan to paste into. MC CityGen still stamps the exported files to the source world's version."></select>
        </div>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" id="reset-world-button"
                title="Go back to the sample world that comes with MC CityGen, with its three areas."><i class="icon icon-reset"></i>Reset</button>
        <button type="button" class="btn primary big" id="extract-button" disabled><i class="icon icon-extract"></i>Extract</button>
      </div>
      <div class="areas">
        <div class="area-card" data-area="road" title="Choose an area that contains the road pieces you want MC CityGen to reuse.">
          <div class="area-top"><h3>Road area</h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i>Choose on map</button>
        </div>
        <div class="area-card" data-area="house" title="Choose a sample area with your standard houses or smaller buildings.">
          <div class="area-top"><h3>House area</h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i>Choose on map</button>
        </div>
        <div class="area-card" data-area="landmark" title="Choose a sample area with taller or special buildings that should stand out in the city.">
          <div class="area-top"><h3>Landmark area</h3><span class="chip"></span></div>
          <p class="area-detail"></p>
          <button type="button" class="btn secondary"><i class="icon icon-map"></i>Choose on map</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Preview: Stage 3 -->
  <main class="page" id="preview" role="tabpanel" hidden>
    <section class="stage">
      <div class="viewer" id="viewer-grid" data-caption="Road layout" data-icon="refresh" data-bounded="height"
           data-message="Preview layout to see the road network before building the final city."></div>
      <div class="viewer" id="viewer-city-preview" data-caption="City layout" data-icon="refresh" data-bounded="height"
           data-message="Preview layout to see how buildings fit into the generated road network."></div>
    </section>

    <section class="dock algo-controls">
      <div class="dock-row">
        <span class="selectors"></span>
        <button type="button" class="disclosure" aria-expanded="false"><span>More settings</span><i class="chevron"></i></button>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" data-action="reset"><i class="icon icon-reset"></i>Reset</button>
        <button type="button" class="btn primary big" data-action="run" disabled><i class="icon icon-refresh"></i>Preview</button>
      </div>
      <div class="advanced"><div class="advanced-inner"></div></div>
    </section>
  </main>

  <!-- Build: Stages 4 and 5 -->
  <main class="page" id="build" role="tabpanel" hidden>
    <section class="stage">
      <div class="viewer" id="viewer-city-render" data-caption="Final city" data-icon="render" data-bounded="height"
           data-message="Build city to create the schematic, the render, and the exported MC world."></div>
    </section>

    <section class="dock algo-controls">
      <div class="dock-row">
        <span class="selectors"></span>
        <button type="button" class="disclosure" aria-expanded="false"><span>More settings</span><i class="chevron"></i></button>
        <span class="spacer"></span>
        <button type="button" class="btn primary big" data-action="worlds"
                title="Open the folder of exported worlds, to copy one into your MC saves."><i class="icon icon-folder"></i>Worlds</button>
        <button type="button" class="btn primary big" data-action="run" disabled><i class="icon icon-render"></i>Build</button>
      </div>
      <div class="advanced"><div class="advanced-inner"></div></div>
    </section>
  </main>

  <!-- The ground the window stands on, and the run of the tab that's showing, step by step: grass growing over dirt. -->
  <footer class="ground">
    <div class="ground-run current" data-tab="extract"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
    <div class="ground-run" data-tab="preview"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
    <div class="ground-run" data-tab="build"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
  </footer>

  <!-- The region map: the world from above, to snap an area to chunks -->
  <dialog id="region-dialog" class="region-dialog">
    <header class="dialog-head">
      <h2></h2>
      <p class="hints"><kbd>Shift</kbd> + drag to select <span>·</span> drag to pan <span>·</span> scroll to zoom</p>
    </header>
    <div class="map-frame">
      <div class="viewer" id="viewer-region" data-icon="map" data-message="Loading world preview..."></div>
    </div>
    <footer class="dialog-foot">
      <div class="foot-info">
        <p class="status"></p>
        <div class="runbar map-run"><span class="status"></span><span class="spinner"></span>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="progress-chunk"></div></div>
        </div>
      </div>
      <button type="button" class="btn secondary" data-action="cancel" autofocus>Cancel</button>
      <button type="button" class="btn primary" data-action="apply" disabled>Use selection</button>
    </footer>
  </dialog>

  <dialog id="error-dialog" class="error-dialog">
    <div class="error-mark" aria-hidden="true">!</div>
    <div>
      <h2></h2>
      <p></p>
      <form method="dialog" class="dialog-foot"><button class="btn primary">OK</button></form>
    </div>
  </dialog>

  <script src="text.js"></script>
  <script src="dom.js"></script>
  <script src="viewer/viewer.js"></script>
  <script src="progress/progress.js"></script>
  <script src="progress/steps.js"></script>
  <script src="form/form.js"></script>
  <script src="region/reveal.js"></script>
  <script src="region/region.js"></script>
  <script src="app.js"></script>
</body>
</html>
