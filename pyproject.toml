[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-city-generator"
version = "1.1.0"
description = "Procedural Minecraft city generation pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "nbtlib>=2.0.4,<3",
    "numba>=0.59,<1",
    "PySide6>=6.7,<7",
    "Pillow>=10.0,<13",
]

[project.optional-dependencies]
build = [
    "minecraft-city-generator",
    "pyinstaller>=6.10,<8",
]

[project.gui-scripts]
citygen = "gui.launcher:main"

[project.scripts]
citygen-doctor = "config.doctor:main"

[tool.setuptools.package-data]
config = ["default_world/*", "default_world/**/*", "color_render.csv"]
gui = ["icons/*.png"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["config", "config.*", "engine", "engine.*", "gui", "gui.*", "pipeline", "pipeline.*"]
