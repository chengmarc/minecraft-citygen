[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-city-generator"
version = "2.0.0"
description = "Procedural MC city generation pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "nbtlib>=2.0.4,<3",
    "numba>=0.59,<1",
    "pywebview>=5.3,<7",
    "Pillow>=10.0,<13",
]

[project.optional-dependencies]
build = [
    "mc-city-generator",
    "pyinstaller>=6.10,<8",
]

[project.gui-scripts]
citygen = "citygen.gui.app:main"

[tool.setuptools.package-data]
citygen = ["data/*", "data/**/*", "gui/static/*", "gui/static/**/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["citygen", "citygen.*"]
