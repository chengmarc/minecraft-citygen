<!doctype html>
<!-- The Store's screenshots: render.py loads this page at 1366 x 768 (rendered at 2x) once per shot, named by the
     hash. Laid out as agent-2b's are: a caption on the left and the app on the right, the real window captured on its
     Build tab (docs/pics/promo*.png). Needs Edge's --allow-file-access-from-files, to read them from file://. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { width: 1366px; height: 768px; }
  /* Behind it all, an in-game shot (docs/pics/base.png) of grass and dirt blocks: it says which game this is for
     without naming it. Shaded darker behind the caption, which also gets a soft shadow. */
  body::before { display: none; }
  .backdrop { position: absolute; inset: 0; background: url(../docs/pics/base.png) center / cover no-repeat; }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.45) 32%, rgba(0, 0, 0, 0.1) 62%, rgba(0, 0, 0, 0.18) 100%);
  }
  .caption { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75); }
  /* Gradient text draws its shadow over itself, so the accent gets a drop shadow instead. */
  .caption .brand { text-shadow: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85)); }
  .facts span { text-shadow: none; background: rgba(0, 0, 0, 0.5); }
  .caption { position: absolute; left: 60px; top: 0; bottom: 0; width: 330px; display: flex; flex-direction: column; justify-content: center; }
  .app { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-bottom: 34px; font-size: 38px; line-height: 1.1; font-weight: 600; }
  .app img { width: 176px; height: 176px; margin-left: -10px; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45)); }
  .app small { display: block; margin-top: 4px; font-size: 28px; font-weight: 400; color: rgba(255, 255, 255, 0.72); }
  h1 { margin: 0; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .caption p { margin: 20px 0 0; font: 400 17px/1.5 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(255, 255, 255, 0.8); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .facts span {
    padding: 6px 13px; border-radius: 999px; font: 600 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
  }

  /* The real window, on the right: Windows 11's rounded corners and a deep shadow, up to 900 x 680 so it never
     reaches the caption. */
  .window {
    position: absolute; right: 44px; top: 50%; transform: translateY(-50%); overflow: hidden; border-radius: 9px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 32px 80px rgba(2, 6, 40, 0.6), 0 10px 24px rgba(2, 6, 40, 0.35);
  }
  .window img { display: block; max-width: 900px; max-height: 680px; }
</style>
</head>
<body>
<script>
  // One entry per shot: its headline (the accent in the grass gradient), text and the capture of the app's
  // window. LISTING.md makes the same claims in words; change both together.
  const FACTS = ["Java Edition 26.1.2+", "Built-in assets", "Use your own world"];   // the same on every shot
  const SHOTS = {
    promo: {
      title: 'A whole city from <span class="brand">the buildings you make.</span>',
      text: "Mark up a few roads and buildings in your MC world. CityGen lays out the streets and fills them.",
      window: "../docs/pics/promo1.png",
    },
    styles: {
      title: 'Any style<br><span class="brand">you build.</span>',
      text: "The city takes the look of the buildings you give it. This medieval town comes from the built-in medieval set.",
      window: "../docs/pics/promo3.png",
    },
    seeds: {
      title: 'Every seed,<br><span class="brand">a new city.</span>',
      text: "Same buildings, new streets. Change the layout seed, or tune road density, spacing and the building mix, and build again.",
      window: "../docs/pics/promo2.png",
    },
    size: {
      title: 'From a village<br><span class="brand">to a metropolis.</span>',
      text: "Five city sizes, from Very Small to Very Big. Preview the roads and the layout before you build.",
      window: "../docs/pics/promo4.png",
    },
  };

  const shot = SHOTS[location.hash.slice(1) || "promo"];
  if (!shot) throw new Error("Unknown shot " + location.hash);
  document.body.insertAdjacentHTML("beforeend", `
    <div class="backdrop"></div>
    <div class="shade"></div>
    <div class="caption">
      <div class="app"><img src="../src/gui/icons/app-icon.svg" alt=""><span>MC CityGen<small>Procedural City Generator</small></span></div>
      <h1>${shot.title}</h1>
      <p>${shot.text}</p>
      <div class="facts">${FACTS.map(f => `<span>${f}</span>`).join("")}</div>
    </div>
    <div class="window"><img src="${shot.window}" alt=""></div>`);
</script>
</body>
</html>
